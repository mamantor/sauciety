services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    restart: unless-stopped
    networks:
      - proxy
  traefik:
    image: traefik:v3.6.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false

      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.dashboard=true
      - --entrypoints.web.forwardedHeaders.trustedIPs=172.22.0.0/16
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=172.22.0.0/16
      - --log.level=DEBUG
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.turbotonio.com`)
      - traefik.http.routers.traefik.entrypoints=websecure
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.traefik.middlewares=authentik@docker
      - traefik.http.routers.traefik.tls=true

      # Global forward-auth middleware definition (Traefik config)
      - traefik.http.middlewares.authentik.forwardauth.address=http://authentik-server:9000/outpost.goauthentik.io/auth/traefik
      - traefik.http.middlewares.authentik.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.authentik.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid

  authentik-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AK_POSTGRES_PASSWORD}
      POSTGRES_DB: authentik
    volumes:
      - authentik_db:/var/lib/postgresql/data
    networks:
      - proxy

  authentik-redis:
    image: redis:7-alpine
    networks:
      - proxy

  authentik-server:
    image: ghcr.io/goauthentik/server:2025.12.4
    environment:
      AUTHENTIK_SECRET_KEY: ${AK_SECRET_KEY}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AK_POSTGRES_PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_COOKIE_DOMAIN: turbotonio.com
      AUTHENTIK_INSECURE: "false"
      # Public URL for redirects (local HTTP is fine for testing)
      AUTHENTIK_HOST: https://auth.turbotonio.com
    command: server
    depends_on:
      - authentik-db
      - authentik-redis
    networks:
      - proxy
    labels:
      - traefik.enable=true
      # Auth UI must NOT be protected by forwardAuth (avoid loops)
      - traefik.http.routers.authentik.rule=Host(`auth.turbotonio.com`)
      - traefik.http.routers.authentik.entrypoints=websecure
      - traefik.http.routers.authentik.tls=true
      - traefik.http.services.authentik.loadbalancer.server.port=9000

  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.12.4
    environment:
      AUTHENTIK_SECRET_KEY: ${AK_SECRET_KEY}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AK_POSTGRES_PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_COOKIE_DOMAIN: turbotonio.com
      AUTHENTIK_HOST: https://auth.turbotonio.com
    command: worker
    depends_on:
      - authentik-db
      - authentik-redis
    networks:
      - proxy

  # A tiny demo app to test protection
  whoami:
    image: traefik/whoami:v1.11.0
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.whoami.rule=Host(`whoami.turbotonio.com`)
      - traefik.http.routers.whoami.entrypoints=websecure
      - traefik.http.routers.whoami.middlewares=authentik@docker
      - traefik.http.services.whoami.loadbalancer.server.port=80
      - traefik.http.routers.whoami.tls=true

  # Your existing mongo (kept internal)
  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - internal

  app:
    build : .
    environment:
      MONGODB_URI: mongodb://root:${MONGO_ROOT_PASSWORD}@mongo:27017/yourdb?authSource=admin
      NODE_ENV: production
      PORT: 3000
      ORIGIN: https://sauciety.turbotonio.com
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
    depends_on:
      - mongo
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.sauciety.rule=Host(`sauciety.turbotonio.com`)
      - traefik.http.routers.sauciety.entrypoints=websecure
      - traefik.http.routers.sauciety.tls=true
      - traefik.http.routers.sauciety.middlewares=authentik@docker
      - traefik.http.services.sauciety.loadbalancer.server.port=3000

networks:
  proxy:
    name: proxy
    ipam:
      config:
        - subnet: 172.22.0.0/16
  internal:
    name: internal

volumes:
  authentik_db:
  mongo_data:
