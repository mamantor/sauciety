services:
  
  traefik:
    image: traefik:v3.6.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false

      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https

      - --entrypoints.websecure.forwardedHeaders.insecure=true

      - --api.dashboard=true
      - --log.level=DEBUG
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.localtest.me`)
      - traefik.http.routers.traefik.entrypoints=web
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.traefik.middlewares=authentik@docker

      # Global forward-auth middleware definition (Traefik config)
      - traefik.http.middlewares.authentik.forwardauth.address=http://authentik-server:9000/outpost.goauthentik.io/auth/traefik
      - traefik.http.middlewares.authentik.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.authentik.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid

  authentik-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AK_POSTGRES_PASSWORD}
      POSTGRES_DB: authentik
    volumes:
      - authentik_db:/var/lib/postgresql/data
    networks:
      - proxy

  authentik-redis:
    image: redis:7-alpine
    networks:
      - proxy

  authentik-server:
    image: ghcr.io/goauthentik/server:2025.12.4
    environment:
      AUTHENTIK_SECRET_KEY: ${AK_SECRET_KEY}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AK_POSTGRES_PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: authentik
      # Public URL for redirects (local HTTP is fine for testing)
      AUTHENTIK_HOST: https://auth.localtest.me
    command: server
    depends_on:
      - authentik-db
      - authentik-redis
    networks:
      - proxy
    labels:
      - traefik.enable=true
      # Auth UI must NOT be protected by forwardAuth (avoid loops)
      - traefik.http.routers.authentik.rule=Host(`auth.localtest.me`)
      - traefik.http.routers.authentik.entrypoints=websecure
      - traefik.http.routers.authentik.tls=true
      - traefik.http.services.authentik.loadbalancer.server.port=9000

  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.12.4
    environment:
      AUTHENTIK_SECRET_KEY: ${AK_SECRET_KEY}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AK_POSTGRES_PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_HOST: https://auth.localtest.me
    command: worker
    depends_on:
      - authentik-db
      - authentik-redis
    networks:
      - proxy

  # # A tiny demo app to test protection
  # whoami:
  #   image: traefik/whoami:v1.11.0
  #   networks:
  #     - proxy
  #   labels:
  #     - traefik.enable=true
  #     - traefik.http.routers.whoami.rule=Host(`whoami.localtest.me`)
  #     - traefik.http.routers.whoami.entrypoints=websecure
  #     - traefik.http.routers.whoami.middlewares=authentik@docker
  #     - traefik.http.services.whoami.loadbalancer.server.port=80
  #     - traefik.http.routers.whoami.tls=true


  # Your existing mongo (kept internal)
  mongo:
    image: mongo:4.4.18
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    ports:
      - "27017:27017"

  app:
    image: node:22-alpine
    env_file:
      - .env.local
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --config.confirmModulesPurge=false && ORIGIN=https://sauciety.localtest.me PROTOCOL_HEADER=x-forwarded-proto HOST_HEADER=x-forwarded-host AUTH_URL=https://sauciety.localtest.me pnpm dev -- --host 0.0.0.0"
    environment:
      AUTH_DEBUG: "true"
      AUTH_TRUST_HOST: "true"
      AUTH_URL: https://sauciety.localtest.me
      HOST_HEADER: x-forwarded-host
      MONGODB_URI: mongodb://root:${MONGO_ROOT_PASSWORD}@mongo:27017/sauciety?authSource=admin
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      ORIGIN: https://sauciety.localtest.me
      PROTOCOL_HEADER: x-forwarded-proto
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm-store

    depends_on:
      - mongo
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.sauciety.rule=Host(`sauciety.localtest.me`)
      - traefik.http.routers.sauciety.entrypoints=websecure
      - traefik.http.routers.sauciety.tls=true
      - traefik.http.services.sauciety.loadbalancer.server.port=5173
    extra_hosts:
      - "auth.localtest.me:host-gateway"
      - "sauciety.localtest.me:host-gateway"

networks:
  proxy:
    name: proxy
  internal:
    name: internal

volumes:
  authentik_db:
  mongo_data:
  pnpm_store:
  node_modules:
